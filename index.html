<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noël 2025 - Forêt Enchantée</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="instruction">
        <span>✨ Cliquez sur l'étoile ✨</span>
    </div>

    <div id="star-tooltip"></div>

    <div id="gift-card">
        <div class="card-image-placeholder" id="card-main-image"></div>
        <div class="card-content">
            <h2 id="gift-title">Titre</h2>
            <div id="gift-price">0€</div>
            <p id="gift-desc">Description</p>
            
            <span class="link-placeholder-text">Lien du produit :</span>
            <a id="gift-link" href="#" target="_blank">
                Voir le cadeau ↗
            </a>
            
            <button id="close-btn">Fermer</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
